name: R-CMD-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: GregorLueg/personal-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      rust: true
      gpu: false
      windows: true
      # macOS-latest is arm64. The x86 lane is here because r-universe's
      # macos-x86_64 job trips test_ica.R and nothing of ours reproduces it.
      macos-x86: true
      extra-repositories: 'https://gregorlueg.r-universe.dev'
      rebuild-from-source: 'stringfish qs2'
    secrets: inherit
