name: R-CMD-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: GregorLueg/personal-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      rust: true
      gpu: false
      windows: true
      linux-runner: ubuntu-22.04
      extra-repositories: 'https://gregorlueg.r-universe.dev'
      rebuild-from-source: 'stringfish qs2'
    secrets: inherit
