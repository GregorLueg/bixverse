name: params-drift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  params-drift:
    name: devforge spec drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The comparison is against air-formatted text, so an unformatted runner
      # would report every generated file as stale.
      - uses: posit-dev/setup-air@v1

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install devforge
        run: |
          install.packages(
            "devforge",
            repos = c(
              "https://gregorlueg.r-universe.dev",
              "https://cloud.r-project.org"
            )
          )
        shell: Rscript {0}

      - name: Check generated params against the specs
        run: |
          res <- devforge::params_up_to_date(".")
          if (!isTRUE(res)) {
            stop(
              "Stale generated files: ",
              paste(res, collapse = ", "),
              ". Run devforge::forge_params(\".\")."
            )
          }
        shell: Rscript {0}
