name: pkgdown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    uses: GregorLueg/personal-actions/.github/workflows/r-pkgdown.yml@feat-add-repos
    with:
      rust: true
      gpu: false
      extra-repositories: 'https://gregorlueg.r-universe.dev'
    secrets: inherit
