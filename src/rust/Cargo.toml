[package]
version = '0.5.0'
name = 'bixverse'
publish = false
edition = '2021'
rust-version = '1.90'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'bixverse'

[features]
## Compile HDF5 from source through `hdf5-metno-src`. On by default, since
## that is the only thing that needs no system library. `tools/config.R`
## switches it off with `--no-default-features` when it finds an external
## libhdf5, which is what makes the Windows cross-host builds link.
default = ["hdf5-static"]
hdf5-static = ["bixverse-rs/hdf5-static"]

[profile.dev.package.faer]
opt-level = 3

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[dependencies]
bixverse-rs = { version = "0.5.0", default-features = false, features = [
    "single-cell",
    "multi-modal",
] }
# The `Tested` / `ScTested` / `NebulaParams` types cross the binding boundary,
# so the edgeR and NEBULA wrappers need them by name. Kept in step with the
# version `bixverse-rs` pulls in.
edge-rs = "0.0.2"
extendr-api = "0.9.0"
either = "1.15.0"
faer = { version = '0.23.2' }
half = { version = "2.7.1", features = ["serde"] }
petgraph = { version = "0.8.3", features = ["rayon"] }
rand = { version = "0.9.0", features = ["std"] }
rayon = "1.11.0"
rustc-hash = "2.1.1"
thousands = "*"

[[bin]]
name = "document"
path = "document.rs"

