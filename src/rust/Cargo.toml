[package]
version = '0.4.10'
name = 'bixverse'
publish = false
edition = '2021'
rust-version = '1.90'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'bixverse'

[features]
default = []

[profile.dev.package.faer]
opt-level = 3

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[dependencies]
bixverse-rs = { version = "0.4.6", features = [ "single-cell", "multi-modal", ] }
extendr-api = "0.9.0"
either = "1.15.0"
faer = { version = '0.23.2' }
half = { version = "2.7.1", features = ["serde"] }
petgraph = { version = "0.8.3", features = ["rayon"] }
rand = { version = "0.9.0", features = ["std"] }
rayon = "1.11.0"
rustc-hash = "2.1.1"
thousands = "*"

[[bin]]
name = "document"
path = "document.rs"

# TEMPORARY: bixverse-rs 0.4.6 is not on crates.io yet. Strip this block and
# `cargo update -p bixverse-rs` once the crate is published, otherwise CI cannot
# resolve the dependency. New commits on the branch need an explicit
# `cargo update -p bixverse-rs`, the lock file pins a SHA.
#
# DIALOGUE is in flight: the `feat-dialogue` commits are local only, so this
# points at the sibling checkout. Swap it back to the git form below once the
# branch is pushed, then `cargo update -p bixverse-rs`.
[patch.crates-io]
bixverse-rs = { path = "/Users/gregorlueg/repos/shared/bixverse-rs" }
# bixverse-rs = { git = "https://github.com/GregorLueg/bixverse-rs", branch = "feat-dialogue" }
